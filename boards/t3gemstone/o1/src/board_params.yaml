module_name: t3gemstone_o1_board
parameters:
- group: Sensors
  definitions:
    IMU_GYRO_RATEMAX:
      description:
        short: Gyro control data maximum publication rate (inner loop rate)
        long: |-
          The maximum rate the gyro control data will be allowed to publish at.
          On this board it primarily sets the IMU FIFO drain cadence: a higher
          rate reads fewer samples per poll and leaves more headroom in the
          sensor FIFO.

          This parameter normally lives in the vehicle_angular_velocity module,
          which this sensor-only board does not build; it is provided here so the
          value is a real, runtime-tunable parameter instead of a compile-time
          driver fallback.

          Note: sensor data is always read and filtered at the full raw rate
          regardless of this setting.
      type: enum
      values:
        100: 100 Hz
        250: 250 Hz
        400: 400 Hz
        800: 800 Hz
        1000: 1000 Hz
        2000: 2000 Hz
      default: 400
      min: 100
      max: 2000
      unit: Hz
      reboot_required: true
